services:
  iva-mensual:
    build: .
    container_name: iva-mensual
    restart: unless-stopped
    # Antes: "3500:3500" — accesible directo desde Internet (causa del bug de cookie Secure).
    # Ahora: solo loopback del host. El contenedor nginx-iva lo alcanza via la red Docker interna.
    ports:
      - "127.0.0.1:3500:3500"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3500/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx termina TLS con cert autofirmado y proxeá al iva-mensual.
  # Expone 8443 al host porque nginx_prod (geodaniela) ya tiene 443.
  # 8443 lo atiende el stream{} de nginx.conf (detecta TLS vs HTTP plano y
  # autocorrige en vez de devolver 400) — por eso el mapeo es 8443:8443 y no
  # 8443:443 como antes; el server HTTPS real quedó en el 8444, interno.
  nginx-iva:
    image: nginx:1.27-alpine
    container_name: nginx-iva
    restart: unless-stopped
    depends_on:
      - iva-mensual
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
