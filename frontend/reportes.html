<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Reportes — IVA Mensual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div id="layout-root"></div>

  <main class="container container-wide">
    <div class="page-header">
      <div>
        <h1 class="page-title">Centro de Reportes</h1>
        <p class="page-subtitle">Elige un reporte a la izquierda — aparece al instante, sin recargar la página</p>
      </div>
    </div>

    <div class="centro-reportes">
      <nav class="centro-nav" id="centro-nav"></nav>

      <div class="centro-contenido">
        <h2 id="reporte-titulo">Selecciona un reporte</h2>
        <section class="informe-controls" id="reporte-controles"></section>

        <section class="progress-section" id="progress-section" hidden>
          <div class="progress-header">
            <span id="progress-label">Consultando...</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill progress-fill-indeterminate"></div>
          </div>
        </section>

        <div id="reporte-resultado"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/shared/format.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/table.js"></script>
  <script src="/shared/filters.js"></script>
  <script src="/shared/export.js"></script>
  <script src="/shared/rango.js"></script>
  <script src="/shared/datagrid.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="/js/reportes.js"></script>
  <script>initLayout('reportes')</script>
</body>
</html>
