<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Pantalla interna heredada: accesible por URL pero fuera del índice. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Informe — IVA Mensual</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css?v=6194dc55">
</head>
<body>
  <div id="layout-root"></div>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Informe de Gestión</h1>
        <p class="page-subtitle">Ventas, compras y margen bruto por mes</p>
      </div>
    </div>

    <section class="informe-controls">
      <div class="controls-row">
        <div class="control-group">
          <label for="select-cliente">Empresa</label>
          <select id="select-cliente">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div class="control-group">
          <label for="informe-mes-inicio">Mes inicio</label>
          <select id="informe-mes-inicio"></select>
        </div>
        <div class="control-group">
          <label for="informe-anio-inicio">Año inicio</label>
          <select id="informe-anio-inicio"></select>
        </div>
        <div class="control-group">
          <label for="informe-mes-fin">Mes fin</label>
          <select id="informe-mes-fin"></select>
        </div>
        <div class="control-group">
          <label for="informe-anio-fin">Año fin</label>
          <select id="informe-anio-fin"></select>
        </div>
        <div class="control-group">
          <label for="select-modo">Modo</label>
          <select id="select-modo">
            <option value="resumen">Resumen mensual</option>
            <option value="detalle">Con detalle (facturas / NC / ND)</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-generar">Generar informe</button>
        <button type="button" class="btn btn-secondary" id="btn-probar-sii">Probar conexión SII</button>
      </div>
      <p class="informe-meta" id="estimacion-meta"></p>
    </section>

    <section class="progress-section" id="progress-section" hidden>
      <div class="progress-header">
        <span id="progress-label">Consultando SII...</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-detail" id="progress-detail"></p>
    </section>

    <section class="informe-document" id="informe-result" hidden></section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/shared/format.js?v=b4c60e6c"></script>
  <script src="/shared/toast.js?v=9de61654"></script>
  <script src="/shared/api.js?v=80d2c456"></script>
  <script src="/shared/rango.js?v=8529eb0f"></script>
  <script src="/shared/layout.js?v=9a5448e9"></script>
  <script src="/js/informe.js"></script>
  <script>initLayout('reportes')</script>
</body>
</html>
