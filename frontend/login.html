<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ingresar — Sistema Contable JMV</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    /* Clases lg-* PROPIAS de esta página: la sección .login-* de app.css
       (login-logo = badge 56x56 del design system) es otra cosa — colisión
      CGFloat histórica que descuadraba el logo y la tarjeta en móvil. */
    body.lg-body {
      min-height: 100vh;
      min-height: 100svh; /* móvil: respeta la altura real con barra de URL */
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(560px circle at 50% 0%, var(--accent-soft), transparent 65%),
        var(--bg-canvas);
      padding: var(--space-4);
      padding:
        calc(var(--space-4) + env(safe-area-inset-top))
        calc(var(--space-4) + env(safe-area-inset-right))
        calc(var(--space-4) + env(safe-area-inset-bottom))
        calc(var(--space-4) + env(safe-area-inset-left));
    }
    .lg-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-8) var(--space-6);
      box-shadow: var(--shadow-lg);
    }
    .lg-logo { text-align: center; margin-bottom: var(--space-7, 1.75rem); }
    .lg-logo img { height: 44px; width: auto; display: block; margin: 0 auto var(--space-2); }
    .lg-logo b { display: block; font-family: var(--font-display); font-size: var(--fs-xl); font-weight: var(--fw-bold); letter-spacing: -0.01em; color: var(--fg-primary); }
    .lg-logo small { display: block; margin-top: 2px; font-size: 0.68rem; font-weight: var(--fw-medium); color: var(--fg-muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .lg-error {
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid rgba(var(--danger-rgb), 0.25);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm);
      padding: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .lg-error:empty { display: none; }
    .lg-card .form-group { margin-bottom: var(--space-4); }
    /* 16px en el input evita el zoom automático de iOS al enfocar */
    .lg-card .form-input { font-size: 16px; }
    .lg-card .btn-primary {
      width: 100%;
      justify-content: center;
      margin-top: var(--space-2);
      padding-top: var(--space-3);
      padding-bottom: var(--space-3);
      min-height: 48px; /* target táctil cómodo */
    }
    .lg-foot { margin-top: var(--space-6); text-align: center; font-size: var(--fs-xs); color: var(--fg-muted); }
    .lg-foot a { color: var(--fg-secondary); text-decoration: none; border-bottom: 1px solid var(--border-default); padding-bottom: 1px; }
    .lg-foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    @media (max-width: 360px) {
      .lg-card { padding: var(--space-6) var(--space-4); }
      .lg-logo img { height: 38px; }
    }
  </style>
</head>
<body class="lg-body">
  <form class="lg-card" id="login-form" autocomplete="on">
    <div class="lg-logo">
      <img src="/assets/logo-light.svg" alt="JMV Consultores">
      <b>Sistema Contable</b>
      <small>JMV Consultores</small>
    </div>
    <div class="lg-error" id="login-error"></div>
    <div class="form-group">
      <label class="form-label" for="input-username">Usuario</label>
      <input type="text" id="input-username" class="form-input" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="input-password">Contraseña</label>
      <input type="password" id="input-password" class="form-input" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="btn-login">Ingresar</button>
    <p class="lg-foot">¿Problemas para entrar? <a href="https://jmvconsultores.cl/#contacto">Contacta a JMV Consultores</a></p>
  </form>

  <script src="/shared/api.js"></script>
  <script>
    const form = document.getElementById('login-form')
    const errorEl = document.getElementById('login-error')
    const btn = document.getElementById('btn-login')

    // Si ya hay sesión activa, entrar directo al Sistema Contable.
    // Sondeo con /estado (siempre 200): sin ruido 401 en consola.
    fetch('/api/auth/estado').then((r) => r.json()).then((d) => {
      if (d.autenticado) window.location.href = '/sistema/'
    }).catch(() => {})

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorEl.textContent = ''
      btn.disabled = true
      btn.textContent = 'Ingresando…'
      try {
        await apiPost('/api/auth/login', {
          username: document.getElementById('input-username').value.trim(),
          password: document.getElementById('input-password').value,
        })
        window.location.href = '/sistema/'
      } catch (err) {
        errorEl.textContent = err.message || 'No se pudo iniciar sesión'
        btn.disabled = false
        btn.textContent = 'Ingresar'
      }
    })
  </script>
</body>
</html>
