<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proceso — IVA Mensual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="layout-root"></div>

  <main class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Proceso mensual</h1>
        <p class="page-subtitle" id="clientes-ready">Cargando...</p>
      </div>
    </div>

    <section class="proceso-controls">
      <div class="controls-row">
        <div class="control-group">
          <label for="select-mes">Mes</label>
          <select id="select-mes"></select>
        </div>
        <div class="control-group">
          <label for="select-anio">Año</label>
          <select id="select-anio"></select>
        </div>
        <button type="button" class="btn btn-primary" id="btn-generar">⚡ Generar todo</button>
      </div>
    </section>

    <section class="progress-section" id="progress-section" hidden>
      <div class="progress-header">
        <span id="progress-label">Procesando clientes...</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-detail" id="progress-detail"></p>
      <ul class="progress-log" id="progress-log"></ul>
    </section>

    <section id="resultados-header" class="resultados-header" hidden>
      <div class="resultados-summary" id="resultados-summary"></div>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-reintentar-errores" hidden>Reintentar errores</button>
    </section>

    <div class="resultados-list" id="resultados-list"></div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="/shared/format.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/layout.js"></script>
  <script src="/js/proceso.js"></script>
  <script>initLayout('proceso')</script>
</body>
</html>
