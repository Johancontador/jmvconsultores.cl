<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<title>tarjeta og — jmvconsultores.cl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0a0e1a;
    font-family: Inter, "Segoe UI", sans-serif;
    color: #eef2f8;
    position: relative;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .b1 { width: 560px; height: 560px; background: #1c4f8a; top: -200px; right: -120px; }
  .b2 { width: 460px; height: 460px; background: #2e86c8; bottom: -260px; left: -80px; opacity: .4; }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 70% 30%, #000 0%, transparent 75%);
  }
  .wrap { position: relative; height: 100%; padding: 74px 80px; display: flex; flex-direction: column; }
  .logo { height: 54px; width: auto; margin-bottom: auto; }
  .eyebrow {
    font-size: 21px; letter-spacing: .16em; text-transform: uppercase;
    color: #7fb6e4; font-weight: 600; margin-bottom: 22px;
  }
  h1 {
    font-family: Sora, "Segoe UI", sans-serif; font-weight: 800;
    font-size: 78px; line-height: 1.04; letter-spacing: -2px; max-width: 900px;
  }
  h1 span {
    background: linear-gradient(100deg, #4ea8e8, #8fd3ff 55%, #dff0ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 34px; }
  p.sub { font-size: 27px; color: #b6c3d6; max-width: 720px; line-height: 1.35; }
  .domain { font-family: Sora, sans-serif; font-weight: 600; font-size: 25px; color: #7fb6e4; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="grid"></div>
  <div class="wrap">
    <img class="logo" src="../assets/logo-light.svg" alt="JMV Consultores" />
    <p class="eyebrow">Contabilidad · Remuneraciones · Tributario</p>
    <h1>Tu contabilidad al día,<br /><span>tu negocio en foco.</span></h1>
    <div class="bottom">
      <p class="sub">Contabilidad, remuneraciones y obligaciones tributarias<br />para empresas chilenas, 100% en línea.</p>
      <p class="domain">jmvconsultores.cl</p>
    </div>
  </div>
</body>
</html>
