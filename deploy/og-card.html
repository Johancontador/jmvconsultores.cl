<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<title>tarjeta og — jmvconsultores.cl</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #ffffff;
    font-family: "Segoe UI", system-ui, Helvetica, Arial, sans-serif;
    color: #15202f;
    position: relative;
  }
  .banda { position: absolute; inset: 0 0 auto 0; height: 14px; background: #16243f; }
  .calido {
    position: absolute; inset: 0;
    background: radial-gradient(760px 420px at 82% 14%, #f3efe7 0%, rgba(255,255,255,0) 72%);
  }
  .wrap { position: relative; height: 100%; padding: 68px 80px 62px; display: flex; flex-direction: column; }
  .marca { display: flex; align-items: center; gap: 14px; margin-bottom: auto; }
  .marca img { height: 52px; width: auto; }
  .marca .texto { font-family: Sora, "Segoe UI", sans-serif; font-weight: 700; font-size: 30px; color: #16243f; letter-spacing: -0.5px; }
  .marca .texto small {
    display: block; font-family: "Segoe UI", system-ui, sans-serif; font-size: 15px;
    font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: #6b7483;
  }
  .eyebrow {
    font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
    color: #8a5a2b; font-weight: 700; margin-bottom: 20px;
  }
  h1 {
    font-family: Sora, "Segoe UI", sans-serif; font-weight: 700;
    font-size: 66px; line-height: 1.06; letter-spacing: -1.8px; max-width: 940px;
  }
  h1 em { font-style: normal; color: #8a5a2b; }
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-top: 36px; }
  p.sub { font-size: 25px; color: #55606f; max-width: 760px; line-height: 1.38; }
  .domain { font-family: Sora, "Segoe UI", sans-serif; font-weight: 600; font-size: 24px; color: #16243f; white-space: nowrap; }
  .linea { position: absolute; left: 80px; right: 80px; bottom: 46px; height: 1px; background: #e4dfd6; }
</style>
</head>
<body>
  <div class="banda"></div>
  <div class="calido"></div>
  <div class="wrap">
    <div class="marca">
      <img src="../assets/marca-oscura.svg" alt="" />
      <span class="texto">JMV<small>Consultores</small></span>
    </div>
    <p class="eyebrow">Contabilidad · Remuneraciones · Tributario</p>
    <h1>Contabilidad, gestión y tecnología para <em>avanzar con claridad</em></h1>
    <div class="bottom">
      <p class="sub">Servicios profesionales y plataforma de gestión para pymes chilenas, con atención 100% en línea.</p>
      <p class="domain">jmvconsultores.cl</p>
    </div>
    <div class="linea"></div>
  </div>
</body>
</html>
