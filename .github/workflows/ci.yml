name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Antes enumeraba 10 archivos a mano: cada suite nueva quedaba fuera de CI
      # (las fases UX F1–F5 corrían en local y en producción, pero no aquí). El
      # script `test` de package.json es la lista autoritativa; CI ejecuta eso.
      - name: Tests (npm test)
        run: npm test

      # La sintaxis cubre TODO el JavaScript servido, incluido frontend/sistema
      # (la SPA): un error ahí no lo veía ningún paso del CI.
      - name: Sintaxis (node --check en backend y frontend JS)
        run: |
          set -euo pipefail
          find backend -name "*.js" -print0 | xargs -0 -n1 node --check
          find frontend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check

      # Regla del proyecto: el nginx del VPS fija max-age=14400 a .js/.css, así
      # que cada cambio de frontend debe re-sembrar los ?v=<sha1> del contenido.
      # Este paso falla si alguien lo olvidó (el script es idempotente: sin
      # cambios no toca ningún archivo).
      - name: Anti-caché — referencias ?v= al día
        run: |
          npm run seed:v
          if ! git diff --quiet; then
            echo "❌ Hay referencias ?v= desactualizadas en HTML."
            echo "   Corre 'npm run seed:v' y commitea el resultado antes de subir."
            git diff --stat
            exit 1
          fi
          echo "✅ Las referencias ?v= corresponden al contenido actual"

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — escaneo de secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar que .env no está en el repo
        run: |
          if git ls-files | grep -E "^\.env$|^data/|^.*\.db$"; then
            echo "❌ Archivos sensibles trackeados en git"
            exit 1
          else
            echo "✅ Sin archivos sensibles trackeados"
          fi
