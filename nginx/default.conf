# Nginx reverse proxy para iva-mensual.
# TLS autofirmado (warning del navegador esperado). Solo HTTPS → backend HTTP plano.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/iva.crt;
    ssl_certificate_key /etc/nginx/certs/iva.key;

    # Configuración TLS razonable para cert autofirmado moderno.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logs dentro del contenedor (visibles con `docker logs nginx-iva`).
    access_log /var/log/nginx/iva-access.log;
    error_log  /var/log/nginx/iva-error.log;

    location / {
        proxy_pass http://iva-mensual:3500;

        # Importante: el backend necesita saber que vino por HTTPS
        # para que la cookie se marque Secure correctamente.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket-ready por si el SII scraping usa SSE/streaming en el futuro.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
