# Nginx reverse proxy para iva-mensual.
# TLS autofirmado (warning del navegador esperado). Solo HTTPS → backend HTTP plano.
# El puerto público 8443 en realidad lo atiende el stream{} de nginx.conf,
# que decide TLS real (-> 8444, este archivo) vs HTTP plano (-> 8081, abajo).

# Redirige a HTTPS. Dos usos:
#  - 8080: acceso directo externo, docker lo mapea al host (por si alguien
#    escribe http://ip:8080 a propósito).
#  - 8081: SOLO loopback interno, nunca expuesto al host — es adonde el
#    stream{} manda el tráfico cuando alguien entra sin "https://" al 8443
#    público. Antes eso daba un 400 "plain HTTP request was sent to an
#    HTTPS port"; ahora se autocorrige con un 301 a la URL correcta.
server {
    listen 8080;
    listen [::]:8080;
    listen 8081;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    # SOLO loopback interno — nunca se mapea al host, se llega vía el
    # stream{} de nginx.conf cuando el primer paquete SÍ es un TLS ClientHello.
    listen 127.0.0.1:8444 ssl;
    listen [::1]:8444 ssl;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/iva.crt;
    ssl_certificate_key /etc/nginx/certs/iva.key;

    # Configuración TLS razonable para cert autofirmado moderno.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logs dentro del contenedor (visibles con `docker logs nginx-iva`).
    access_log /var/log/nginx/iva-access.log;
    error_log  /var/log/nginx/iva-error.log;

    location / {
        proxy_pass http://iva-mensual:3500;

        # Este bloque solo se alcanza cuando el stream{} ya confirmó TLS
        # real, así que siempre es https — no depende de $scheme (que aquí
        # dentro del proxy interno podría no reflejar lo que vio el cliente).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket-ready por si el SII scraping usa SSE/streaming en el futuro.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
