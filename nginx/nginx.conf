worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

# El puerto público 8443 recibe TLS normalmente, pero si alguien entra sin
# "https://" (típico en el navegador del celular, que completa con http://
# por default), llega HTTP plano a ese mismo puerto y nginx respondía
# "400 Bad Request — The plain HTTP request was sent to an HTTPS port".
# Este bloque stream{} inspecciona el primer paquete (ssl_preread, sin
# terminar la conexión) para decidir el protocolo ANTES de pasarlo a un
# backend HTTP interno: si es TLS real va al server HTTPS (8444), si no
# (HTTP plano) va al server que solo redirige a https:// (8081).
stream {
  map $ssl_preread_protocol $iva_upstream {
    default 127.0.0.1:8444;
    ""      127.0.0.1:8081;
  }

  server {
    listen 8443;
    listen [::]:8443;
    ssl_preread on;
    proxy_pass $iva_upstream;
    proxy_timeout 300s;
    proxy_connect_timeout 10s;
  }
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
